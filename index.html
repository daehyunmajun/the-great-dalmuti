<script>
// ===== 카드 구성 =====
const cardCounts = {12:12,11:11,10:10,9:9,8:8,7:7,6:6,5:5,4:4,3:3,2:2,1:1};
let deck = [];
for(const [num,count] of Object.entries(cardCounts)){
  for(let i=0;i<count;i++) deck.push(Number(num));
}
deck.push(0,0); // 광대 2장

// ===== P2P 세팅 =====
let peer=null, conn=null, isHost=false, playerId=null, roomId=null;
let gameStarted=false;

// 게임 상태
let gameState = {roundNumber:null, roundCount:null, turnOrder:[], currentTurn:0, players:{}};
let selectedCards=[]; // 이것은 UI 선택 상태일 뿐, 실제 데이터는 gameState.players[pid].hand에 있습니다.

// ===== UI =====
function renderPlayerCards(){
  const area = document.getElementById("playerCards");
  area.innerHTML="";
  const hand = gameState.players[playerId]?.hand || [];
  hand.sort((a,b)=>a-b).forEach((num,idx)=>{
    const div=document.createElement("div");
    div.className="card";
    div.innerText=num===0?"광대":num;
    div.onclick=()=>{toggleCard(idx);}
    if(selectedCards.includes(idx)) div.classList.add("selected");
    area.appendChild(div);
  });
  updatePlayerList();
  updateTurnInfo();
}

function toggleCard(idx){
  if(!isMyTurn()) return alert("지금은 당신 차례가 아닙니다!");
  if(selectedCards.includes(idx)) selectedCards=selectedCards.filter(i=>i!==idx);
  else selectedCards.push(idx);
  renderPlayerCards(); // 로컬 UI만 즉시 갱신
}

function updatePlayerList(){
  const listDiv=document.getElementById("playerList");
  let html=gameState.turnOrder.map(pid=>gameState.players[pid].name).join("<br>");
  listDiv.innerHTML=html;
}

function updateTurnInfo(){
  const info=document.getElementById("turnInfo");
  if(gameState.turnOrder.length===0) info.innerText="대기 중";
  else{
    // gameState.currentTurn이 turnOrder 길이를 초과하는 경우 방어 코드
    if (gameState.currentTurn >= gameState.turnOrder.length) {
        gameState.currentTurn = 0; 
    }
    const pid=gameState.turnOrder[gameState.currentTurn];
    if (gameState.players[pid]) {
      info.innerText=`턴: ${gameState.players[pid].name}`;
    } else {
      info.innerText = "플레이어 정보 로딩 중...";
    }
  }
}

function updateTableArea(msg){
  document.getElementById("tableArea").innerText=msg;
}

// ===== 내 차례 확인 =====
function isMyTurn(){
  return gameState.turnOrder[gameState.currentTurn] === playerId;
}

// ===== 카드 내기 (CHANGED) =====
// 이제 이 함수들은 '요청'을 보내거나 '처리 함수'를 호출합니다.
function playSelected(){
  if(!isMyTurn()) return alert("지금은 당신 차례가 아닙니다!");
  if(!selectedCards.length) return alert("카드를 선택하세요");

  const indices = [...selectedCards]; // 보낼 인덱스 복사
  selectedCards = []; // UI에서 즉시 선택 해제
  renderPlayerCards(); // 선택 해제된 상태로 UI 갱신

  if (isHost) {
    processPlay(playerId, indices); // 방장은 로컬에서 바로 처리
  } else {
    conn.send({ type: "action", action: "play", selectedIndices: indices }); // 클라이언트는 호스트에게 요청
  }
}

function playerPass(){
  if(!isMyTurn()) return alert("지금은 당신 차례가 아닙니다!");

  if (isHost) {
    processPass(playerId); // 방장은 로컬에서 바로 처리
  } else {
    conn.send({ type: "action", action: "pass" }); // 클라이언트는 호스트에게 요청
  }
}

// ===== 턴 넘기기 =====
function nextTurn(){
  gameState.currentTurn=(gameState.currentTurn+1)%gameState.turnOrder.length;
  updateTurnInfo();
}

// ===== (NEW) Host 전용 액션 처리 함수들 =====
// processPlay: 호스트가 플레이어의 카드 제출을 검증하고 처리합니다.
function processPlay(pid, selectedIndices) {
  // 1. 유효성 검사 (Validation)
  const hand = gameState.players[pid].hand;
  // selectedIndices가 hand 길이를 벗어나는지 확인 (간단한 방어)
  if (!selectedIndices.every(i => i < hand.length)) {
      console.log(`[Host] Invalid indices from ${pid}`);
      return; // 유효하지 않은 인덱스
  }
  let cards = selectedIndices.map(i => hand[i]);
  let normal = cards.filter(x => x !== 0);
  let number = normal.length ? normal[0] : 0;

  if (gameState.roundCount !== null) {
    if (cards.length !== gameState.roundCount) {
      console.log(`[Host] Invalid move by ${pid}: wrong count`);
      // 여기에 클라이언트에게 '실패' 메시지를 보내는 로직을 추가할 수 있습니다.
      return; // Invalid
    }
    if (number >= gameState.roundNumber) {
      console.log(`[Host] Invalid move by ${pid}: number too high`);
      return; // Invalid
    }
    // (수정) 광대만 낼 경우 number가 0이 되므로, normal.length > 0 조건 추가
    if (normal.length > 0 && !normal.every(n => n === number)) {
      console.log(`[Host] Invalid move by ${pid}: not same number`);
      return; // Invalid
    }
  }

  // 2. 상태 업데이트 (State Update)
  // 유효한 이동이므로, gameState를 변경합니다.
  selectedIndices.sort((a, b) => b - a).forEach(i => hand.splice(i, 1)); // 카드 제거
  
  gameState.roundNumber = number;
  gameState.roundCount = cards.length;
  updateTableArea(`${gameState.players[pid].name}: ${cards.length}장 (${number === 0 ? "광대 포함" : number})`);
  
  // 3. 턴 넘기기
  nextTurn();
  
  // 4. 전파 (Broadcast)
  broadcastGameState();
}

// processPass: 호스트가 플레이어의 패스를 처리합니다.
function processPass(pid) {
  updateTableArea(`${gameState.players[pid].name} 패스`);
  nextTurn();
  broadcastGameState();
}

// ===== Host/Join 버튼 =====
document.getElementById("hostBtn").onclick=()=>{
  playerId="P"+Math.floor(Math.random()*10000);
  isHost=true;
  peer=new Peer(playerId);
  peer.on('connection', c=>{
    console.log(`[Host] New connection from ${c.peer}`);
    c.on('data', d=>handleDataFromPlayer(d,c)); // 'c' (connection) 객체를 넘깁니다.
    c.on('open', () => {
        // 클라이언트가 연결되면, 즉시 현재 게임 상태를 보냅니다.
        // 이 시점에는 'join' 메시지를 받기 전이므로, 'join' 처리 후가 더 나을 수 있습니다.
        // c.send({type:"gameState",state:gameState});
    });
  });
  peer.on('open', id=>{
    roomId=id;
    alert(`방장 생성 완료, 방 ID: ${roomId}`);
    setupHost();
  });
};

document.getElementById("joinBtn").onclick=()=>{
  const name=document.getElementById("playerName").value||"Player1"; // 기본 이름 변경
  playerId="P"+Math.floor(Math.random()*10000);
  roomId=document.getElementById("roomId").value;
  if(!roomId) return alert("방 ID 필요");
  peer=new Peer(playerId);
  peer.on('open',()=>{
    conn = peer.connect(roomId);
    conn.on('open', ()=>{
      console.log(`[Client] Connected to Host ${roomId}`);
      conn.on('data', handleData);
      conn.send({type:"join",name:name,id:playerId});
    });
  });
};

// ===== Host 세팅 =====
function setupHost(){
  const name=document.getElementById("playerName").value||"Host";
  gameState.players[playerId]={name:name,hand:[],pass:false};
  gameState.turnOrder.push(playerId);
  // 방장 설정 시에는 아직 카드를 분배하지 않습니다.
  // 'join' 로직에서 gameStarted 플래그로 관리하는 것이 좋습니다.
  // (기존 로직 유지)
  if(!gameStarted){
    distributeCards(); // -> 하지만 플레이어가 1명일 때 분배됩니다.
    gameStarted=true;
  }
  updateTurnInfo();
  renderPlayerCards();
  broadcastGameState(); // 방장 자신에게는 보낼 필요 없지만, UI 갱신 겸..
}

// ===== 카드 분배 (CHANGED) =====
// 버려지는 카드 없도록 수정
function distributeCards(){
  const ids=gameState.turnOrder;
  if (ids.length === 0) return; // 플레이어가 없으면 중단

  const shuffled=[...deck].sort(()=>Math.random()-0.5);
 
  // 모든 플레이어의 손을 초기화
  ids.forEach(pid => { 
    if(gameState.players[pid]) gameState.players[pid].hand = []; 
  });

  // 한 장씩 돌아가며 분배
  let playerIndex = 0;
  shuffled.forEach(card => {
    const pid = ids[playerIndex];
    gameState.players[pid].hand.push(card);
    playerIndex = (playerIndex + 1) % ids.length; // 다음 플레이어로 순환
  });
}

// ===== 데이터 처리 =====
// handleData (Client-side): 호스트로부터 받은 데이터를 처리합니다.
function handleData(d){
  if(d.type==="gameState"){
    const pidSelf = playerId;
    const remoteState = d.state;
    
    // 중요: 호스트가 보낸 gameState를 그대로 받되, 내 카드 정보는 보존해야 합니다.
    // 하지만 현재 구조는 호스트가 '모든' 정보를 보내는 방식입니다.
    // (기존 로직 유지)
    for(const pid in remoteState.players){
      if(pid!==pidSelf) {
        // 다른 사람의 패는 갯수만 알 수 있게 하거나, 비워둡니다.
        // 호스트가 애초에 이렇게 보내는 것이 좋습니다.
        remoteState.players[pid].hand=[]; 
      }
    }

    // (수정) 내 카드는 받았는데, selectedCards가 꼬일 수 있으므로 초기화
    const myOldHand = gameState.players[pidSelf]?.hand || [];
    const myNewHand = remoteState.players[pidSelf]?.hand || [];
    if (myOldHand.length !== myNewHand.length) {
        selectedCards = []; // 카드를 내거나 받아 상태가 변경되면 선택 해제
    }

    gameState=remoteState;
    renderPlayerCards();
  }
}

// handleDataFromPlayer (Host-side) (CHANGED): 클라이언트의 'join' 또는 'action'을 처리합니다.
function handleDataFromPlayer(d,conn){
  const pid = conn.peer; // 'conn.peer'가 클라이언트의 'playerId'입니다.

  if(d.type==="join"){
    console.log(`[Host] Join request from ${pid} (${d.name})`);
    gameState.players[pid]={name:d.name,hand:[],pass:false};
    gameState.turnOrder.push(pid);
    
    // (수정) 여기서 카드 분배를 다시 하는 것이 좋습니다.
    // 또는 게임 시작 버튼을 따로 만들어야 합니다.
    // 지금은 플레이어가 들어올 때마다 다시 섞습니다. (테스트용)
    distributeCards(); 
    gameStarted = true;
    
    broadcastGameState();
  } else if (d.type === "action") {
    // 1. 턴 확인 (중요)
    if (gameState.turnOrder[gameState.currentTurn] !== pid) {
        console.log(`[Host] Action from ${pid} but it's not their turn.`);
        return; // 턴이 아니면 무시
    }

    // 2. 액션 분기
    if (d.action === "play") {
        processPlay(pid, d.selectedIndices);
    } else if (d.action === "pass") {
        processPass(pid);
    }
  }
}

// ===== 상태 브로드캐스트 (CHANGED) =====
// (수정) 클라이언트에게 '안전한' gameState를 보내도록 수정하는 것이 좋습니다.
function broadcastGameState(){
  // 현재: 모든 정보를 다 보냄
  for(const c in peer.connections){
    for(const con of peer.connections[c]){
      con.send({type:"gameState",state:gameState});
    }
  }
  
  // (참고) 이상적인 방식:
  // for (const pid of gameState.turnOrder) {
  //   if (pid === playerId) continue; // 호스트 자신에겐 안 보냄
  //
  //   const stateForPlayer = JSON.parse(JSON.stringify(gameState)); // 깊은 복사
  //   // 다른 플레이어들의 패를 숨김
  //   for (const otherPid in stateForPlayer.players) {
  //     if (otherPid !== pid) { // 이 메시지를 '받을' 사람이 아니라면
  //       stateForPlayer.players[otherPid].hand = []; // 패 숨김
  //     }
  //   }
  //   
  //   // 해당 플레이어(pid)의 커넥션을 찾아서 보냄
  //   if (peer.connections[pid]) {
  //     peer.connections[pid].forEach(con => {
  //       con.send({ type: "gameState", state: stateForPlayer });
  //     });
  //   }
  // }

  // 호스트 자신도 UI 갱신
  renderPlayerCards();
}
</script>
