<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>멀티 달무티 P2P</title>
<script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
<style>
body { font-family: Arial; padding: 20px; }
.cards { margin-top: 10px; }
.card {
  display: inline-block;
  padding: 8px 12px;
  margin: 4px;
  background: #eee;
  border-radius: 5px;
  cursor: pointer;
  font-size: 20px;
}
.selected { background: #ffc107; font-weight: bold; }
#playersInfo, #playerList { margin-top: 15px; }
button { margin-top: 5px; margin-right: 5px; }
</style>
</head>
<body>

<h2>멀티 달무티 P2P</h2>

<label>이름: <input type="text" id="playerName" placeholder="Player1"></label>
<button id="hostBtn">방장 시작</button>
<button id="joinBtn">방 참가</button>
<input type="text" id="roomId" placeholder="방 ID">

<h3>접속 플레이어</h3>
<div id="playerList"></div>

<h3>내 카드</h3>
<div id="playerCards" class="cards"></div>
<button onclick="playSelected()">선택 카드 내기</button>
<button onclick="playerPass()">패스</button>

<h3>턴 정보</h3>
<div id="turnInfo"></div>

<h3>테이블 상태</h3>
<div id="tableArea"></div>

<script>
// ===== 카드 구성 =====
const cardCounts = {12:12,11:11,10:10,9:9,8:8,7:7,6:6,5:5,4:4,3:3,2:2,1:1};
let fullDeck = [];
for(const [num,count] of Object.entries(cardCounts)){
  for(let i=0;i<count;i++) fullDeck.push(Number(num));
}
fullDeck.push(0,0); // 광대 2장

// ===== P2P 설정 =====
let peer=null, conn=null, isHost=false, playerId=null, roomId=null;

// 게임 상태
let gameState = {roundNumber:null, roundCount:null, turnOrder:[], currentTurn:0, players:{}};
let selectedCards=[];

// ===== UI =====
function renderPlayerCards(){
  const area = document.getElementById("playerCards");
  area.innerHTML="";
  const hand = gameState.players[playerId]?.hand || [];
  hand.sort((a,b)=>a-b).forEach((num,idx)=>{
    const div=document.createElement("div");
    div.className="card";
    div.innerText=num===0?"광대":num;
    div.onclick=()=>{toggleCard(idx);}
    if(selectedCards.includes(idx)) div.classList.add("selected");
    area.appendChild(div);
  });
  updatePlayerList();
  updateTurnInfo();
}

function toggleCard(idx){
  if(!isMyTurn()) return alert("지금은 당신 차례가 아닙니다!");
  if(selectedCards.includes(idx)) selectedCards=selectedCards.filter(i=>i!==idx);
  else selectedCards.push(idx);
  renderPlayerCards();
}

function updatePlayerList(){
  const listDiv=document.getElementById("playerList");
  listDiv.innerHTML = gameState.turnOrder.map(pid=>gameState.players[pid].name).join("<br>");
}

function updateTurnInfo(){
  const info=document.getElementById("turnInfo");
  if(gameState.turnOrder.length===0) info.innerText="대기 중";
  else{
    const pid=gameState.turnOrder[gameState.currentTurn];
    info.innerText=`턴: ${gameState.players[pid].name}`;
  }
}

function updateTableArea(msg){
  document.getElementById("tableArea").innerText=msg;
}

// ===== 내 차례 확인 =====
function isMyTurn(){
  return gameState.turnOrder[gameState.currentTurn] === playerId;
}

// ===== 카드 내기 =====
function playSelected(){
  if(!isMyTurn()) return alert("지금은 당신 차례가 아닙니다!");
  if(!selectedCards.length) return alert("카드를 선택하세요");
  const hand = gameState.players[playerId].hand;
  let cards = selectedCards.map(i=>hand[i]);
  let normal = cards.filter(x=>x!==0);
  let number = normal.length?normal[0]:0;

  if(gameState.roundCount!==null){
    if(cards.length!==gameState.roundCount) return alert(`${gameState.roundCount}장만 낼 수 있습니다`);
    if(number>=gameState.roundNumber) return alert(`${gameState.roundNumber}보다 낮아야 합니다`);
    if(!normal.every(n=>n===number)) return alert("같은 숫자 카드만 낼 수 있습니다(광대 허용)");
  }

  selectedCards.sort((a,b)=>b-a).forEach(i=>hand.splice(i,1));
  selectedCards=[];

  gameState.roundNumber=number;
  gameState.roundCount=cards.length;
  updateTableArea(`${gameState.players[playerId].name}: ${cards.length}장 (${number===0?"광대 포함":number})`);

  if(isHost) {
    nextTurn();
    broadcastGameState();
  }
  renderPlayerCards();
}

function playerPass(){
  if(!isMyTurn()) return alert("지금은 당신 차례가 아닙니다!");
  updateTableArea(`${gameState.players[playerId].name} 패스`);
  if(isHost){
    nextTurn();
    broadcastGameState();
  }
}

// ===== 턴 넘기기 =====
function nextTurn(){
  gameState.currentTurn=(gameState.currentTurn+1)%gameState.turnOrder.length;
}

// ===== Host/Join 버튼 =====
document.getElementById("hostBtn").onclick=()=>{
  playerId="P"+Math.floor(Math.random()*10000);
  isHost=true;
  peer=new Peer(playerId);
  peer.on('open', id=>{
    roomId=id;
    alert(`방장 생성 완료, 방 ID: ${roomId}`);
    setupHost();
  });
};

document.getElementById("joinBtn").onclick=()=>{
  const name=document.getElementById("playerName").value||"Player";
  playerId="P"+Math.floor(Math.random()*10000);
  roomId=document.getElementById("roomId").value;
  if(!roomId) return alert("방 ID 필요");
  peer=new Peer(playerId);
  peer.on('open',id=>{
    conn=peer.connect(roomId);
    conn.on('open',()=>{conn.send({type:"join",name:name,id:playerId});});
    conn.on('data',handleData);
  });
};

// ===== Host 세팅 =====
function setupHost(){
  const name=document.getElementById("playerName").value||"Host";
  gameState.players[playerId]={name:name,hand:[],pass:false};
  gameState.turnOrder.push(playerId);
  peer.on('connection',c=>{c.on('data',d=>handleDataFromPlayer(d,c));});
  distributeCards();
  updatePlayerList();
  updateTurnInfo();
  renderPlayerCards();
  broadcastGameState();
}

// ===== 카드 분배 (게임 시작 전만) =====
function distributeCards(){
  const ids=gameState.turnOrder;
  const shuffled=[...fullDeck].sort(()=>Math.random()-0.5);
  const perPlayer=Math.floor(shuffled.length/ids.length);
  for(let i=0;i<ids.length;i++){
    const pid=ids[i];
    gameState.players[pid].hand=shuffled.slice(i*perPlayer,(i+1)*perPlayer);
  }
}

// ===== 데이터 처리 =====
function handleData(d){
  if(d.type==="gameState") gameState=d.state;
  renderPlayerCards();
}

function handleDataFromPlayer(d,conn){
  if(d.type==="join"){
    const pid=d.id;
    gameState.players[pid]={name:d.name,hand:[],pass:false};
    gameState.turnOrder.push(pid);
    if(isHost){
      distributeCards(); // 게임 시작 전만 섞기
      broadcastGameState();
    }
    updatePlayerList();
  }
}

// ===== 상태 브로드캐스트 =====
function broadcastGameState(){
  for(const c in peer.connections){
    for(const con of peer.connections[c]){
      con.send({type:"gameState",state:gameState});
    }
  }
}
</script>
</body>
</html>
