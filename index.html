<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>달무티 MVP 2~6인</title>

<!-- Tailwind CDN (개발용 – 경고는 무시해도 됨) -->
<script src="https://cdn.tailwindcss.com"></script>

<style>
  body { background:#f8fafc; font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif; }
  .card { width:72px;height:104px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;cursor:pointer;user-select:none;box-shadow:0 2px 6px rgba(0,0,0,0.08); }
  .card.selected { outline:4px solid #f97316; transform:translateY(-6px); }
  .avatar { width:36px;height:36px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;background:#eef2ff; }
</style>
</head>
<body class="p-4 md:p-8">
<div class="max-w-5xl mx-auto">

  <header class="mb-6">
    <h1 class="text-2xl font-extrabold text-sky-700">달무티 MVP 2~6인</h1>
    <p class="text-sm text-gray-600">Firebase 실시간 동기화 – PeerJS 없이 순수 JS</p>
  </header>

  <!-- ===== 입력 ===== -->
  <section class="mb-4 grid gap-3 md:grid-cols-3">
    <input id="nameInput" placeholder="닉네임" class="p-2 border rounded" />
    <input id="avatarInput" placeholder="아바타(이모지)" class="p-2 border rounded" />
    <div class="flex gap-2">
      <button id="createBtn" class="px-3 py-2 bg-green-600 text-white rounded">방 생성 (호스트)</button>
      <input id="roomInput" placeholder="방 ID 입력" class="p-2 border rounded" />
      <button id="joinBtn" class="px-3 py-2 bg-blue-600 text-white rounded">참가</button>
    </div>
  </section>

  <!-- ===== 방 정보 ===== -->
  <section class="mb-6 grid md:grid-cols-3 gap-4">
    <div class="col-span-1 bg-white p-4 rounded shadow">
      <h3 class="font-semibold mb-2">방 정보</h3>
      <p>방 ID: <span id="roomIdDisplay" class="font-mono"></span></p>
      <p class="mt-2">호스트: <span id="hostDisplay">-</span></p>
      <p class="mt-2">현재 턴: <span id="turnDisplay">-</span></p>
      <div class="mt-3">
        <button id="startGameBtn" class="px-3 py-2 bg-orange-500 text-white rounded">게임 시작 (호스트)</button>
      </div>
    </div>

    <div class="col-span-2 bg-white p-4 rounded shadow">
      <h3 class="font-semibold mb-2">플레이어 목록</h3>
      <div id="playersList" class="flex gap-3 flex-wrap"></div>
    </div>
  </section>

  <!-- ===== 게임 보드 ===== -->
  <section class="mb-6 bg-white p-4 rounded shadow">
    <div class="grid grid-cols-12 gap-4 items-center">
      <div id="playerAreas" class="col-span-12 grid grid-cols-6 gap-2 text-center"></div>

      <div class="col-span-12 mt-4">
        <div class="mb-3 flex justify-between items-center">
          <div><strong>테이블</strong></div>
          <div>
            <button id="passBtn" class="px-3 py-2 bg-gray-200 rounded">패스</button>
            <button id="submitBtn" class="px-3 py-2 bg-amber-500 text-white rounded ml-2">제출</button>
          </div>
        </div>

        <div id="tableArea" class="mb-3"></div>

        <div>
          <div class="text-sm text-gray-500 mb-2">내 카드 (클릭해 선택 → 제출)</div>
          <div id="myHand" class="flex gap-2 flex-wrap"></div>
        </div>
      </div>
    </div>
  </section>
</div>

<!-- ===== Firebase + 게임 로직 ===== -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
import { 
  getDatabase, ref, set, update, get, onValue, push, child, remove, onDisconnect 
} from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyB6ktKQxiTzvbCHgaB2gd75_DmXHF5bApw",
  authDomain: "the-great-dalmuti.firebaseapp.com",
  databaseURL: "https://the-great-dalmuti-default-rtdb.firebaseio.com/",
  projectId: "the-great-dalmuti",
  storageBucket: "the-great-dalmuti.firebasestorage.app",
  messagingSenderId: "421041977864",
  appId: "1:421041977864:web:b04725eab3c4cb436c2fbd",
  measurementId: "G-MJCMWKCH8C"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// 전역에 노출 (콘솔에서 사용 가능)
window.db = db;
window.getDatabase = getDatabase;
window.app = app;

// ===== 나머지 기존 코드 그대로 (아래 붙여넣기) =====
// (너가 이미 가지고 있는 DOM, 상태, 함수들 전부 그대로 복사해서 여기에 붙여넣기)
// 예: nameInput, createBtn, renderMyHand, submitBtn 등

document.addEventListener('DOMContentLoaded', () => {
  // ... (너의 기존 코드 전체 붙여넣기)
  // 단, attachHostWatcher 안에 아래처럼 수정!

  // ===== 호스트 감지 (강화 버전) =====
  const attachHostWatcher = (roomId) => {
    const hostRef = ref(db, `rooms/${roomId}/host`);
    onValue(hostRef, (snap) => {
      isHost = snap.val() === localPlayerId;
      console.log('호스트 감지:', isHost ? '내가 호스트' : '호스트 아님');
      if (isHost && !window.hostListenerStarted) {
        window.hostListenerStarted = true;
        startHostActionListener(roomId);
      }
    });
  };

  // ===== 호스트 액션 리스너 (전역 등록) =====
  window.startHostActionListener = function(roomId) {
    console.log('호스트 액션 리스너 시작됨 - roomId:', roomId);
    const actionsRef = ref(db, `rooms/${roomId}/actions`);
    onValue(actionsRef, async (snap) => {
      if (!snap.exists()) return;
      const actions = snap.val();
      const keys = Object.keys(actions).sort();
      for (const k of keys) {
        const a = actions[k];
        const roomSnap = await get(ref(db, `rooms/${roomId}`));
        if (!roomSnap.exists()) continue;
        const room = roomSnap.val();
        const players = Object.keys(room.players || {});
        if (players.length === 0) continue;
        const expectedPid = players[room.turnIndex % players.length];
        if (a.playerId !== expectedPid) { await remove(child(actionsRef, k)); continue; }

        if (a.type === 'pass') {
          await update(ref(db, `rooms/${roomId}`), { turnIndex: (room.turnIndex + 1) % players.length });
          await remove(child(actionsRef, k));
          continue;
        }

        if (a.type === 'play') {
          const handSnap = await get(ref(db, `rooms/${roomId}/players/${a.playerId}/hand`));
          const hand = handSnap.val() || [];
          const sel = a.selectedIndices.slice().sort((x,y)=>y-x);
          const played = sel.map(i=>hand[i]);
          const nonWild = played.filter(c=>c!==0);
          const number = nonWild.length > 0 ? nonWild[0] : 13;

          if (nonWild.length > 0 && !nonWild.every(c=>c===number)) {
            await remove(child(actionsRef, k)); continue;
          }

          const rc = room.roundCount;
          const rn = room.roundNumber;
          if (rc !== null && played.length !== rc) { await remove(child(actionsRef, k)); continue; }
          if (rn !== null && number >= rn) { await remove(child(actionsRef, k)); continue; }

          const newHand = hand.slice(); sel.forEach(i=>newHand.splice(i,1));
          const updates = {};
          updates[`rooms/${roomId}/players/${a.playerId}/hand`] = newHand;
          updates[`rooms/${roomId}/table/${a.playerId}`] = played;
          updates[`rooms/${roomId}/roundCount`] = played.length;
          updates[`rooms/${roomId}/roundNumber`] = number;
          updates[`rooms/${roomId}/turnIndex`] = (room.turnIndex + 1) % players.length;
          await update(ref(db), updates);
          await remove(child(actionsRef, k));
        } else {
          await remove(child(actionsRef, k));
        }
      }
    });
  };

  // ===== 호스트 감지 =====
  const attachHostWatcher = (roomId) => {
    const hostRef = ref(db, `rooms/${roomId}/host`);
    onValue(hostRef, (snap) => {
      isHost = snap.val() === localPlayerId;
      console.log('디버그: 호스트 감지 - isHost:', isHost);
      if (isHost) startHostActionListener(roomId);
    });
  };

  const showMessage = (txt) => alert(txt);
});
</script>
</body>
</html>
