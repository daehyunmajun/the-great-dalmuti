<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>달무티 2~6인 MVP</title>

<!-- Tailwind CSS for quick styling -->
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { background:#f8fafc; font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;}
.card { width:72px;height:104px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;cursor:pointer;user-select:none;box-shadow:0 2px 6px rgba(0,0,0,0.08);}
.card.selected{outline:4px solid #f97316;transform:translateY(-6px);}
.card.disabled{opacity:0.4;cursor:not-allowed;}
.avatar { width:36px;height:36px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;background:#eef2ff;}
</style>
</head>
<body class="p-4 md:p-8">
<div class="max-w-5xl mx-auto">
  <header class="mb-6">
    <h1 class="text-2xl font-extrabold text-sky-700">달무티 MVP 2~6인</h1>
    <p class="text-sm text-gray-600">Firebase + PeerJS 공식 서버 + 미니멀 카드 UI</p>
  </header>

  <!-- 설정 / 방 만들기 -->
  <section class="mb-4 grid gap-3 md:grid-cols-3">
    <input id="nameInput" placeholder="닉네임" class="p-2 border rounded" />
    <input id="avatarInput" placeholder="아바타(이모지)" class="p-2 border rounded" />
    <div class="flex gap-2">
      <button id="createBtn" class="px-3 py-2 bg-green-600 text-white rounded">방 생성 (호스트)</button>
      <input id="roomInput" placeholder="방 ID 입력" class="p-2 border rounded" />
      <button id="joinBtn" class="px-3 py-2 bg-blue-600 text-white rounded">참가</button>
    </div>
  </section>

  <!-- 룸 정보 -->
  <section class="mb-6 grid md:grid-cols-3 gap-4">
    <div class="col-span-1 bg-white p-4 rounded shadow">
      <h3 class="font-semibold mb-2">방 정보</h3>
      <p>방 ID: <span id="roomIdDisplay" class="font-mono"></span></p>
      <p class="mt-2">호스트: <span id="hostDisplay">-</span></p>
      <p class="mt-2">현재 턴: <span id="turnDisplay">-</span></p>
      <div class="mt-3">
        <button id="startGameBtn" class="px-3 py-2 bg-orange-500 text-white rounded">게임 시작 (호스트)</button>
      </div>
    </div>

    <div class="col-span-2 bg-white p-4 rounded shadow">
      <h3 class="font-semibold mb-2">플레이어 목록</h3>
      <div id="playersList" class="flex gap-3 flex-wrap"></div>
    </div>
  </section>

  <!-- 테이블/핸드 -->
  <section class="mb-6 bg-white p-4 rounded shadow">
    <div class="grid grid-cols-12 gap-4 items-center">
      <div id="playerAreas" class="col-span-12 grid grid-cols-6 gap-2 text-center"></div>
      <div class="col-span-12 mt-4">
        <div class="mb-3 flex justify-between items-center">
          <div><strong>테이블</strong></div>
          <div>
            <button id="passBtn" class="px-3 py-2 bg-gray-200 rounded">패스</button>
            <button id="submitBtn" class="px-3 py-2 bg-amber-500 text-white rounded ml-2">제출</button>
          </div>
        </div>
        <div id="tableArea" class="mb-3"></div>
        <div>
          <div class="text-sm text-gray-500 mb-2">내 카드 (클릭해 선택 → 제출)</div>
          <div id="myHand" class="flex gap-2 flex-wrap"></div>
        </div>
      </div>
    </div>
  </section>
</div>

<!-- Firebase SDK -->
<script type="module">
  // Firebase import (완벽)
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
  import { 
    getDatabase, ref, set, update, get, onValue, push, child, remove 
  } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";

  // Firebase config (너의 프로젝트)
  const firebaseConfig = {
    apiKey: "AIzaSyB6ktKQxiTzvbCHgaB2gd75_DmXHF5bApw",
    authDomain: "the-great-dalmuti.firebaseapp.com",
    databaseURL: "https://the-great-dalmuti-default-rtdb.firebaseio.com",
    projectId: "the-great-dalmuti",
    storageBucket: "the-great-dalmuti.firebasestorage.app",
    messagingSenderId: "421041977864",
    appId: "1:421041977864:web:b04725eab3c4cb436c2fbd",
    measurementId: "G-MJCMWKCH8C"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);

  /* ===== PeerJS 설정 (나중에 제거 가능) ===== */
  const PEERJS_CONFIG = { host:'peerjs.com', port:443, secure:true };
  let peer, conn;

const nameInput = document.getElementById('nameInput');
const avatarInput = document.getElementById('avatarInput');
const createBtn = document.getElementById('createBtn');
const joinBtn = document.getElementById('joinBtn');
const roomInput = document.getElementById('roomInput');
const roomIdDisplay = document.getElementById('roomIdDisplay');
const hostDisplay = document.getElementById('hostDisplay');
const playersList = document.getElementById('playersList');
const startGameBtn = document.getElementById('startGameBtn');
const turnDisplay = document.getElementById('turnDisplay');
const myHandDiv = document.getElementById('myHand');
const tableArea = document.getElementById('tableArea');
const passBtn = document.getElementById('passBtn');
const submitBtn = document.getElementById('submitBtn');
const playerAreas = document.getElementById('playerAreas');

let localPlayerId=null, localName=null, localAvatar=null, currentRoomId=null, isHost=false;
let mySelectedIndices=[];

/* ===== 카드 덱 생성 (12~1 + 광대 2) ===== */
function makeDeck(){
  const counts={12:12,11:11,10:10,9:9,8:8,7:7,6:6,5:5,4:4,3:3,2:2,1:1};
  const deck=[];
  for(const [n,c] of Object.entries(counts)) for(let i=0;i<c;i++) deck.push(Number(n));
  deck.push(0,0);
  return deck;
}

/* ===== 방 생성 ===== */
createBtn.onclick = async ()=>{
  localName=(nameInput.value||'Host').slice(0,16);
  localAvatar=(avatarInput.value||'👑').slice(0,64);
  localPlayerId='P'+Math.floor(Math.random()*1e6);
  isHost=true;
  const roomId=Math.random().toString(36).slice(2,8).toUpperCase();
  currentRoomId=roomId;
  roomIdDisplay.textContent=roomId;

  const roomRef=ref(db, `rooms/${roomId}`);
  await set(roomRef,{host:localPlayerId, turnIndex:0, roundNumber:null, roundCount:null, table:{}, createdAt:Date.now()});

  const playersRef=ref(db, `rooms/${roomId}/players/${localPlayerId}`);
  await set(playersRef,{name:localName, avatar:localAvatar, hand:[]});

  hostDisplay.textContent=localName+' (You)';
  listenRoom(roomId);
  attachRoomMetaWatcher(roomId);
  showMessage(`방 생성됨: ${roomId} (호스트)`);
  setupPeer(localPlayerId);
};

/* ===== 방 참가 ===== */
joinBtn.onclick = async ()=>{
  const roomId=(roomInput.value||'').trim().toUpperCase();
  if(!roomId){ alert('방 ID 입력'); return; }
  localName=(nameInput.value||'Player').slice(0,16);
  localAvatar=(avatarInput.value||'🙂').slice(0,64);
  localPlayerId='P'+Math.floor(Math.random()*1e6);
  isHost=false;
  currentRoomId=roomId;

  const snapshot=await get(ref(db, `rooms/${roomId}`));
  if(!snapshot.exists()){ alert('해당 방 없음'); return; }

  const playersRef=ref(db, `rooms/${roomId}/players/${localPlayerId}`);
  await set(playersRef,{name:localName, avatar:localAvatar, hand:[]});

  roomIdDisplay.textContent=roomId;
  hostDisplay.textContent='(joining...)';
  listenRoom(roomId);
  attachRoomMetaWatcher(roomId);
  showMessage(`방 참가: ${roomId}`);
  setupPeer(localPlayerId);
};

/* ===== PeerJS 연결 ===== */
function setupPeer(id){
  peer = new Peer(id, PEERJS_CONFIG);
  peer.on('open', ()=>console.log('Peer open:', id));
  peer.on('connection', c=>{
    conn=c;
    conn.on('data', data=>console.log('받음:',data));
    conn.on('open', ()=>console.log('연결됨'));
  });
  peer.on('error', err=>console.error(err));
}

/* ===== 게임 시작 (카드 분배) ===== */
startGameBtn.onclick = async ()=>{
  if(!currentRoomId || !isHost) return alert('호스트만 시작 가능');
  const r = await get(ref(db, `rooms/${currentRoomId}/players`));
  const players = r.exists() ? Object.keys(r.val()) : [];
  if(players.length<2){ alert('2인 이상 필요'); return; }

  const deck = makeDeck().sort(()=>Math.random()-0.5);
  const hands={}; players.forEach(pid=>hands[pid]=[]);
  let idx=0; deck.forEach(c=>{ hands[players[idx]].push(c); idx=(idx+1)%players.length; });
  const updates={}; players.forEach(pid=>updates[`rooms/${currentRoomId}/players/${pid}/hand`]=hands[pid]);
  updates[`rooms/${currentRoomId}/turnIndex`]=0;
  updates[`rooms/${currentRoomId}/roundNumber`]=null;
  updates[`rooms/${currentRoomId}/roundCount`]=null;
  updates[`rooms/${currentRoomId}/table`]={};
  await update(ref(db), updates);
  showMessage('카드 분배 완료');
};

/* ===== 룸 리스너 ===== */
function listenRoom(roomId){
  const roomRef = ref(db, `rooms/${roomId}`);
  onValue(roomRef, snap=>{
    if(!snap.exists()) return;
    const room = snap.val();
    renderPlayers(room.players||{}, room);
    renderTable(room.table||{});
    if(room.turnIndex!==undefined){
      const ids = Object.keys(room.players||{});
      const currentPid = ids[room.turnIndex % ids.length];
      turnDisplay.textContent = room.players[currentPid]?.name || '-';
    }
  });
}

/* ===== 플레이어 UI 렌더 ===== */
function renderPlayers(playersObj, room){
  playersList.innerHTML=''; playerAreas.innerHTML='';
  const ids=Object.keys(playersObj||{});
  ids.forEach(pid=>{
    const p=playersObj[pid];
    const div=document.createElement('div');
    div.className='flex items-center gap-2 p-2 bg-slate-50 rounded';
    const ava=document.createElement('div'); ava.className='avatar'; ava.textContent=p.avatar||'🙂';
    const txt=document.createElement('div');
    txt.innerHTML=`<div class="text-sm font-semibold">${p.name}</div><div class="text-xs text-gray-500">${(p.hand||[]).length}장</div>`;
    if(pid===localPlayerId) txt.innerHTML+='<div class="text-xs text-amber-500"> (You)</div>';
    div.appendChild(ava); div.appendChild(txt); playersList.appendChild(div);

    // 좌석 영역
    const seatDiv=document.createElement('div');
    seatDiv.innerHTML=`<div class="avatar inline-block mb-1">${p.avatar||'🙂'}</div><div class="text-sm font-semibold">${p.name}</div>`;
    playerAreas.appendChild(seatDiv);
  });
  const myHand = playersObj[localPlayerId]?.hand||[];
  renderMyHand(myHand, room);
}

/* ===== 내 카드 렌더 ===== */
function renderMyHand(hand, room){
  myHandDiv.innerHTML='';
  hand.sort((a,b)=>a-b).forEach((card, idx)=>{
    const d=document.createElement('div'); d.className='card bg-white';
    d.innerText = card===0?'광대':card;
    d.onclick = ()=>{
      if(mySelectedIndices.includes(idx)) { mySelectedIndices=mySelectedIndices.filter(i=>i!==idx); d.classList.remove('selected'); }
      else { mySelectedIndices.push(idx); d.classList.add('selected'); }
    };
    myHandDiv.appendChild(d);
  });
}

/* ===== 테이블 렌더 ===== */
function renderTable(tbl){
  tableArea.innerHTML='';
  const entries=Object.entries(tbl||{});
  if(entries.length===0){ tableArea.innerHTML='<div class="text-sm text-gray-500">아직 제출된 카드 없음</div>'; return; }
  entries.forEach(([pid,cards])=>{
    const node=document.createElement('div'); node.className='mb-2 text-sm text-gray-500';
    node.innerHTML=`${pid}: ${cards.map(c=>c===0?'광대':c).join(', ')}`;
    tableArea.appendChild(node);
  });
}

/* ===== 액션: 패스/제출 ===== */
passBtn.onclick = async ()=>{
  if(!currentRoomId || !localPlayerId) return alert('방 참가 후');
  await push(ref(db, `rooms/${currentRoomId}/actions`), {type:'pass',playerId:localPlayerId,ts:Date.now()});
  mySelectedIndices=[];
};

submitBtn.onclick = async ()=>{
  if(!currentRoomId || !localPlayerId) return alert('방 참가 후');
  if(mySelectedIndices.length===0) return alert('카드 선택');
  await push(ref(db, `rooms/${currentRoomId}/actions`), {type:'play',playerId:localPlayerId,selectedIndices:mySelectedIndices,ts:Date.now()});
  mySelectedIndices=[];
};

/* ===== HOST 액션 큐 처리 ===== */
function startHostActionListener(roomId){
  const actionsRef=ref(db, `rooms/${roomId}/actions`);
  onValue(actionsRef, async snap=>{
    if(!isHost||!snap.exists()) return;
    const actions = snap.val(); const keys=Object.keys(actions).sort();
    for(const k of keys){
      const a=actions[k];
      const roomSnap = await get(ref(db, `rooms/${roomId}`));
      if(!roomSnap.exists()) continue;
      const room = roomSnap.val();
      const players = Object.keys(room.players||{});
      const expectedPid = players[room.turnIndex%players.length];
      if(a.playerId!==expectedPid){ await remove(child(actionsRef,k)); continue; }

      if(a.type==='pass'){
        const newIndex=(room.turnIndex+1)%players.length;
        await update(ref(db, `rooms/${roomId}`),{turnIndex:newIndex});
        await remove(child(actionsRef,k));
      } else if(a.type==='play'){
        const handSnap=await get(ref(db, `rooms/${roomId}/players/${a.playerId}/hand`));
        let hand=handSnap.exists()?handSnap.val():[];
        const sel=a.selectedIndices.slice().sort((x,y)=>y-x);
        const played=sel.map(i=>hand[i]);
        // 검증: 같은 숫자 (광대 제외)
        const nonWild=played.filter(c=>c!==0);
        let number=nonWild.length?nonWild[0]:0;
        if(nonWild.length>0 && !nonWild.every(c=>c===number)){ await remove(child(actionsRef,k)); continue; }
        // 이전 라운드 비교
        const roundCount=room.roundCount; const roundNumber=room.roundNumber;
        if(roundCount!=null && played.length!==roundCount){ await remove(child(actionsRef,k)); continue; }
        if(number>=roundNumber && number!==0){ await remove(child(actionsRef,k)); continue; }

        const newHand=hand.slice(); sel.forEach(i=>newHand.splice(i,1));
        const updates={};
        updates[`rooms/${roomId}/players/${a.playerId}/hand`]=newHand;
        updates[`rooms/${roomId}/table/${a.playerId}`]=played;
        updates[`rooms/${roomId}/roundCount`]=played.length;
        updates[`rooms/${roomId}/roundNumber`]=number;
        updates[`rooms/${roomId}/turnIndex`]=(room.turnIndex+1)%players.length;
        await update(ref(db, `rooms/${roomId}`),updates);
        await remove(child(actionsRef,k));
      } else { await remove(child(actionsRef,k)); }
    }
  });
}

/* ===== 방 메타 감시 (호스트 감지) ===== */
function attachRoomMetaWatcher(roomId){
  const metaRef=ref(db, `rooms/${roomId}/host`);
  onValue(metaRef, snap=>{
    isHost = snap.val()===localPlayerId;
    if(isHost) startHostActionListener(roomId);
  });
}

/* ===== 유틸 ===== */
function showMessage(text){ alert(text); }

</script>
</body>
</html>
