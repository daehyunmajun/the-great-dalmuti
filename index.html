<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
import { getDatabase, ref, set, get, update, push, onValue, remove, child } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";

// Firebase config (기존 그대로)
const firebaseConfig = {
  apiKey: "AIzaSyB6ktKQxiTzvbCHgaB2gd75_DmXHF5bApw",
  authDomain: "the-great-dalmuti.firebaseapp.com",
  databaseURL: "https://the-great-dalmuti-default-rtdb.firebaseio.com",
  projectId: "the-great-dalmuti",
  storageBucket: "the-great-dalmuti.firebasestorage.app",
  messagingSenderId: "421041977864",
  appId: "1:421041977864:web:b04725eab3c4cb436c2fbd",
  measurementId: "G-MJCMWKCH8C"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

/* ===== PeerJS ===== */
import Peer from "https://cdn.jsdelivr.net/npm/peerjs@1.4.7/dist/peerjs.min.js";

// 공식 PeerJS 서버 사용 (0.peerjs.com 종료 문제 해결)
const PEERJS_CONFIG = { host: 'peerjs.com', port: 443, secure: true };
let peer = null;
let connections = {}; // 다른 플레이어와의 DataConnection 저장

function initPeer(playerId){
  peer = new Peer(playerId, PEERJS_CONFIG);

  peer.on('open', id => {
    console.log('PeerJS ready with ID:', id);
  });

  peer.on('connection', conn => {
    console.log('Incoming connection from', conn.peer);
    connections[conn.peer] = conn;

    conn.on('data', data => {
      console.log('Received from', conn.peer, data);
      // 여기서 join 메시지 등 처리 가능
    });

    conn.on('close', () => {
      console.log('Connection closed:', conn.peer);
      delete connections[conn.peer];
    });
  });

  peer.on('error', err => {
    console.error('PeerJS error:', err);
    alert('PeerJS 연결 오류: ' + err);
  });
}

// 참가자가 방에 접속할 때
async function joinRoom(roomId){
  const localPlayerId = 'P' + Math.floor(Math.random()*1000000);
  initPeer(localPlayerId);

  // 호스트 ID 가져오기 (Firebase)
  const hostSnap = await get(ref(db, `rooms/${roomId}/host`));
  if(!hostSnap.exists()){ alert('방 없음'); return; }
  const hostId = hostSnap.val();

  // 호스트에게 연결
  const conn = peer.connect(hostId);
  connections[hostId] = conn;

  conn.on('open', () => {
    console.log('Connected to host:', hostId);
    conn.send({ type: 'join', playerId: localPlayerId });
  });

  conn.on('data', data => {
    console.log('Data from host:', data);
  });

  conn.on('close', () => {
    console.log('Disconnected from host');
    delete connections[hostId];
  });
}

// 호스트가 방 생성할 때
function createRoom(){
  const hostId = 'P' + Math.floor(Math.random()*1000000);
  initPeer(hostId);

  // Firebase에 host 등록
  const roomId = Math.random().toString(36).slice(2,8).toUpperCase();
  set(ref(db, `rooms/${roomId}/host`), hostId);

  return { roomId, hostId };
}
</script>
