<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>멀티 달무티 P2P</title>
<script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
<style>
body { font-family: Arial; padding: 20px; }
.cards { margin-top: 10px; }
.card {
  display: inline-block;
  padding: 8px 12px;
  margin: 4px;
  background: #eee;
  border-radius: 5px;
  cursor: pointer;
  font-size: 20px;
}
.selected { background: #ffc107; font-weight: bold; }
#playerList { margin-top: 15px; }
button { margin-top: 5px; margin-right: 5px; }
</style>
</head>
<body>

<h2>멀티 달무티 P2P</h2>

<label>이름: <input type="text" id="playerName" placeholder="Player1"></label>
<button id="hostBtn">방장 시작</button>
<button id="joinBtn">방 참가</button>
<input type="text" id="roomId" placeholder="방 ID">

<h3>접속 플레이어</h3>
<div id="playerList"></div>

<h3>내 카드</h3>
<div id="playerCards" class="cards"></div>
<button onclick="playSelected()">선택 카드 내기</button>
<button onclick="playerPass()">패스</button>

<h3>턴 정보</h3>
<div id="turnInfo"></div>

<h3>테이블 상태</h3>
<div id="tableArea"></div>

<script>
// ===== 카드 구성 =====
const cardCounts = {12:12,11:11,10:10,9:9,8:8,7:7,6:6,5:5,4:4,3:3,2:2,1:1};
let deck = [];
for(const [num,count] of Object.entries(cardCounts)){
  for(let i=0;i<count;i++) deck.push(Number(num));
}
deck.push(0,0); // 광대 2장

// ===== P2P 세팅 =====
let peer=null, conn=null, isHost=false, playerId=null, roomId=null;
let gameStarted=false;

// 게임 상태
let gameState = {roundNumber:null, roundCount:null, turnOrder:[], currentTurn:0, players:{}};
let selectedCards=[];

// ===== UI =====
function renderPlayerCards(){
  const area = document.getElementById("playerCards");
  area.innerHTML="";
  const hand = gameState.players[playerId]?.hand || [];
  hand.sort((a,b)=>a-b).forEach((num,idx)=>{
    const div=document.createElement("div");
    div.className="card";
    div.innerText=num===0?"광대":num;
    div.onclick=()=>{toggleCard(idx);}
    if(selectedCards.includes(idx)) div.classList.add("selected");
    area.appendChild(div);
  });
  updatePlayerList();
  updateTurnInfo();
}

function toggleCard(idx){
  if(!isMyTurn()) return alert("지금은 당신 차례가 아닙니다!");
  if(selectedCards.includes(idx)) selectedCards=selectedCards.filter(i=>i!==idx);
  else selectedCards.push(idx);
  renderPlayerCards();
}

function updatePlayerList(){
  const listDiv=document.getElementById("playerList");
  let html=gameState.turnOrder.map(pid=>gameState.players[pid].name).join("<br>");
  listDiv.innerHTML=html;
}

function updateTurnInfo(){
  const info=document.getElementById("turnInfo");
  if(gameState.turnOrder.length===0) info.innerText="대기 중";
  else{
    if (gameState.currentTurn >= gameState.turnOrder.length) gameState.currentTurn=0;
    const pid=gameState.turnOrder[gameState.currentTurn];
    info.innerText=gameState.players[pid]?.name ? `턴: ${gameState.players[pid].name}` : "플레이어 로딩 중...";
  }
}

function updateTableArea(msg){
  document.getElementById("tableArea").innerText=msg;
}

function isMyTurn(){
  return gameState.turnOrder[gameState.currentTurn] === playerId;
}

// ===== 카드 액션 =====
function playSelected(){
  if(!isMyTurn()) return alert("지금은 당신 차례가 아닙니다!");
  if(!selectedCards.length) return alert("카드를 선택하세요");

  const indices = [...selectedCards];
  selectedCards=[];
  renderPlayerCards();

  if(isHost) processPlay(playerId, indices);
  else conn.send({type:"action",action:"play",selectedIndices:indices});
}

function playerPass(){
  if(!isMyTurn()) return alert("지금은 당신 차례가 아닙니다!");
  if(isHost) processPass(playerId);
  else conn.send({type:"action",action:"pass"});
}

function nextTurn(){
  gameState.currentTurn=(gameState.currentTurn+1)%gameState.turnOrder.length;
  updateTurnInfo();
}

// ===== Host 전용 처리 =====
function processPlay(pid, indices){
  const hand = gameState.players[pid].hand;
  if (!indices.every(i=>i<hand.length)) return;
  let cards=indices.map(i=>hand[i]);
  let normal=cards.filter(x=>x!==0);
  let number=normal.length?normal[0]:0;

  if(gameState.roundCount!==null){
    if(cards.length!==gameState.roundCount) return;
    if(number>=gameState.roundNumber) return;
    if(normal.length>0 && !normal.every(n=>n===number)) return;
  }

  indices.sort((a,b)=>b-a).forEach(i=>hand.splice(i,1));
  gameState.roundNumber=number;
  gameState.roundCount=cards.length;
  updateTableArea(`${gameState.players[pid].name}: ${cards.length}장 (${number===0?"광대 포함":number})`);

  nextTurn();
  broadcastGameState();
}

function processPass(pid){
  updateTableArea(`${gameState.players[pid].name} 패스`);
  nextTurn();
  broadcastGameState();
}

// ===== Host/Join =====
document.getElementById("hostBtn").onclick=()=>{
  playerId="P"+Math.floor(Math.random()*10000);
  isHost=true;
  peer=new Peer(playerId);
  peer.on('connection',c=>{
    c.on('data',d=>handleDataFromPlayer(d,c));
  });
  peer.on('open',id=>{
    roomId=id;
    alert(`방장 생성 완료, 방 ID: ${roomId}`);
    setupHost();
  });
};

document.getElementById("joinBtn").onclick=()=>{
  const name=document.getElementById("playerName").value||"Player1";
  playerId="P"+Math.floor(Math.random()*10000);
  roomId=document.getElementById("roomId").value;
  if(!roomId) return alert("방 ID 필요");
  peer=new Peer(playerId);
  peer.on('open',()=>{
    conn=peer.connect(roomId);
    conn.on('open',()=>{
      conn.on('data',handleData);
      conn.send({type:"join",name:name,id:playerId});
    });
  });
};

// ===== Host 세팅 =====
function setupHost(){
  const name=document.getElementById("playerName").value||"Host";
  gameState.players[playerId]={name:name,hand:[],pass:false};
  gameState.turnOrder.push(playerId);
  if(!gameStarted){distributeCards(); gameStarted=true;}
  updateTurnInfo();
  renderPlayerCards();
  broadcastGameState();
}

// ===== 카드 분배 =====
function distributeCards(){
  const ids=gameState.turnOrder;
  if(ids.length===0) return;
  const shuffled=[...deck].sort(()=>Math.random()-0.5);
  ids.forEach(pid=>gameState.players[pid].hand=[]);
  let idx=0;
  shuffled.forEach(card=>{
    const pid=ids[idx];
    gameState.players[pid].hand.push(card);
    idx=(idx+1)%ids.length;
  });
}

// ===== 데이터 처리 =====
function handleData(d){
  if(d.type==="gameState"){
    const pidSelf=playerId;
    const remote=d.state;
    for(const pid in remote.players){
      if(pid!==pidSelf) remote.players[pid].hand=[];
    }
    const myOld=gameState.players[pidSelf]?.hand||[];
    const myNew=remote.players[pidSelf]?.hand||[];
    if(myOld.length!==myNew.length) selectedCards=[];
    gameState=remote;
    renderPlayerCards();
  }
}

function handleDataFromPlayer(d,conn){
  const pid=conn.peer;
  if(d.type==="join"){
    gameState.players[pid]={name:d.name,hand:[],pass:false};
    gameState.turnOrder.push(pid);
    if(!gameStarted){distributeCards(); gameStarted=true;}
    broadcastGameState();
  } else if(d.type==="action"){
    if(gameState.turnOrder[gameState.currentTurn]!==pid) return;
    if(d.action==="play") processPlay(pid,d.selectedIndices);
    else if(d.action==="pass") processPass(pid);
  }
}

// ===== 브로드캐스트 =====
function broadcastGameState(){
  for(const c in peer.connections){
    for(const con of peer.connections[c]){
      con.send({type:"gameState",state:gameState});
    }
  }
  renderPlayerCards();
}
</script>
</body>
</html>
