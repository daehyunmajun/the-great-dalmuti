<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>달무티 완전판</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background:#f8fafc; font-family:Inter,sans-serif; }
  .card { width:72px;height:104px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;cursor:pointer;user-select:none;box-shadow:0 2px 6px rgba(0,0,0,0.08); }
  .card.selected { outline:4px solid #f97316; transform:translateY(-6px);}
  .card.disabled { opacity:0.4; cursor:not-allowed; }
  .avatar { width:36px;height:36px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;background:#eef2ff;}
</style>
</head>
<body class="p-4 md:p-8">

<div class="max-w-5xl mx-auto">
  <header class="mb-6">
    <h1 class="text-2xl font-extrabold text-sky-700">달무티 완전판</h1>
    <p class="text-sm text-gray-600">Firebase + PeerJS 실시간 + 클라이밍 룰</p>
  </header>

  <!-- 방 생성/참가 -->
  <section class="mb-4 grid gap-3 md:grid-cols-3">
    <input id="nameInput" placeholder="닉네임" class="p-2 border rounded" />
    <input id="avatarInput" placeholder="아바타(이모지)" class="p-2 border rounded" />
    <div class="flex gap-2">
      <button id="createBtn" class="px-3 py-2 bg-green-600 text-white rounded">방 생성 (호스트)</button>
      <input id="roomInput" placeholder="방 ID 입력" class="p-2 border rounded" />
      <button id="joinBtn" class="px-3 py-2 bg-blue-600 text-white rounded">참가</button>
    </div>
  </section>

  <!-- 방 정보 & 플레이어 목록 -->
  <section class="mb-6 grid md:grid-cols-3 gap-4">
    <div class="col-span-1 bg-white p-4 rounded shadow">
      <h3 class="font-semibold mb-2">방 정보</h3>
      <p>방 ID: <span id="roomIdDisplay" class="font-mono"></span></p>
      <p>호스트: <span id="hostDisplay">-</span></p>
      <p>현재 턴: <span id="turnDisplay">-</span></p>
      <div class="mt-3">
        <button id="startGameBtn" class="px-3 py-2 bg-orange-500 text-white rounded">게임 시작</button>
      </div>
    </div>
    <div class="col-span-2 bg-white p-4 rounded shadow">
      <h3 class="font-semibold mb-2">플레이어 목록</h3>
      <div id="playersList" class="flex gap-3 flex-wrap"></div>
    </div>
  </section>

  <!-- 테이블 & 내 카드 -->
  <section class="mb-6 bg-white p-4 rounded shadow">
    <div class="grid grid-cols-12 gap-4 items-center">
      <div class="col-span-3 text-center" id="p2Area"></div>
      <div class="col-span-3 text-center" id="p1Area"></div>
      <div class="col-span-6 md:col-span-6">
        <div class="mb-3 flex justify-between items-center">
          <div><strong>테이블</strong></div>
          <div>
            <button id="passBtn" class="px-3 py-2 bg-gray-200 rounded">패스</button>
            <button id="submitBtn" class="px-3 py-2 bg-amber-500 text-white rounded ml-2">제출</button>
          </div>
        </div>
        <div class="mb-3" id="tableArea"></div>
        <div class="mt-3">
          <div class="text-sm text-gray-500 mb-2">내 카드 (클릭 → 선택)</div>
          <div id="myHand" class="flex gap-2 flex-wrap"></div>
        </div>
      </div>
      <div class="col-span-3 text-center" id="p3Area"></div>
      <div class="col-span-12 text-center mt-4" id="p4Area"></div>
    </div>
  </section>

  <footer class="text-xs text-gray-500">MVP 테스트용</footer>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
import { getDatabase, ref, set, get, update, onValue, push, remove, child } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";
import Peer from 'https://cdn.jsdelivr.net/npm/peerjs@1.4.7/dist/peerjs.min.js';

// ===== Firebase 설정 =====
const firebaseConfig = { apiKey:"AIza...", authDomain:"...", databaseURL:"https://the-great-dalmuti-default-rtdb.firebaseio.com", projectId:"the-great-dalmuti", storageBucket:"...", messagingSenderId:"...", appId:"..." };
const app=initializeApp(firebaseConfig);
const db=getDatabase(app);

// ===== PeerJS =====
const PEERJS_CONFIG={host:'peerjs.com',port:443,secure:true};
let peer, conn;

// ===== DOM =====
const nameInput=document.getElementById('nameInput'), avatarInput=document.getElementById('avatarInput'), createBtn=document.getElementById('createBtn'), joinBtn=document.getElementById('joinBtn'), roomInput=document.getElementById('roomInput');
const roomIdDisplay=document.getElementById('roomIdDisplay'), hostDisplay=document.getElementById('hostDisplay'), playersList=document.getElementById('playersList'), startGameBtn=document.getElementById('startGameBtn');
const turnDisplay=document.getElementById('turnDisplay'), myHandDiv=document.getElementById('myHand'), tableArea=document.getElementById('tableArea');
const passBtn=document.getElementById('passBtn'), submitBtn=document.getElementById('submitBtn');
const p1Area=document.getElementById('p1Area'), p2Area=document.getElementById('p2Area'), p3Area=document.getElementById('p3Area'), p4Area=document.getElementById('p4Area');

// ===== 상태 =====
let localPlayerId=null, localName=null, localAvatar=null, currentRoomId=null, isHost=false;
let mySelectedIndices=[];

// ===== 카드 생성 =====
function makeDeck(){const counts={12:12,11:11,10:10,9:9,8:8,7:7,6:6,5:5,4:4,3:3,2:2,1:1};const deck=[];for(const [n,c] of Object.entries(counts)) for(let i=0;i<c;i++) deck.push(Number(n));deck.push(0,0);return deck;}

// ===== 방 생성/참가 =====
createBtn.onclick=async()=>{
  localName=(nameInput.value||'Host').slice(0,16);
  localAvatar=(avatarInput.value||'👑').slice(0,64);
  localPlayerId='P'+Math.floor(Math.random()*1000000);
  isHost=true;
  const roomId=Math.random().toString(36).slice(2,8).toUpperCase();
  currentRoomId=roomId; roomIdDisplay.textContent=roomId;
  peer=new Peer(localPlayerId,PEERJS_CONFIG);
  peer.on('open',id=>console.log('호스트 Peer:',id));
  peer.on('connection',c=>{c.on('data',msg=>{push(ref(db,`rooms/${roomId}/actions`),msg);});});
  await set(ref(db,`rooms/${roomId}`),{host:localPlayerId,turnIndex:0,table:{},roundCount:0});
  await set(ref(db,`rooms/${roomId}/players/${localPlayerId}`),{name:localName,avatar:localAvatar,hand:[]});
  hostDisplay.textContent=localName+' (You)'; listenRoom(roomId); attachRoomMetaWatcher(roomId); alert(`방 생성됨: ${roomId}`);
};

joinBtn.onclick=async()=>{
  const roomId=(roomInput.value||'').trim().toUpperCase();
  if(!roomId){alert('방 ID 입력'); return;}
  localName=(nameInput.value||'Player').slice(0,16);
  localAvatar=(avatarInput.value||'🙂').slice(0,64);
  localPlayerId='P'+Math.floor(Math.random()*1000000); isHost=false; currentRoomId=roomId;
  peer=new Peer(localPlayerId,PEERJS_CONFIG); peer.on('open',id=>console.log('참가 Peer:',id));
  conn=peer.connect(roomId);
  conn.on('open',()=>conn.send({type:'join',name:localName,avatar:localAvatar,playerId:localPlayerId}));
  const snapshot=await get(ref(db,`rooms/${roomId}`));
  if(!snapshot.exists()){alert('해당 방 없음'); return;}
  await set(ref(db,`rooms/${roomId}/players/${localPlayerId}`),{name:localName,avatar:localAvatar,hand:[]});
  roomIdDisplay.textContent=roomId; hostDisplay.textContent='(joining...)'; listenRoom(roomId); attachRoomMetaWatcher(roomId); alert(`방 참가 요청 전송: ${roomId}`);
};

// ===== 게임 시작 (호스트) =====
startGameBtn.onclick=async()=>{
  if(!currentRoomId||!isHost) return alert('호스트만 시작 가능');
  const r=await get(ref(db,`rooms/${currentRoomId}/players`)); const players=r.exists()?Object.keys(r.val()):[];
  if(players.length===0) return alert('참가자가 없습니다');
  const deck=makeDeck().sort(()=>Math.random()-0.5);
  const hands={}; players.forEach(pid=>hands[pid]=[]);
  let idx=0; deck.forEach(card=>{const pid=players[idx]; hands[pid].push(card); idx=(idx+1)%players.length;});
  const updates={}; for(const pid of players) updates[`rooms/${currentRoomId}/players/${pid}/hand`]=hands[pid];
  updates[`rooms/${currentRoomId}/turnIndex`]=0; updates[`rooms/${currentRoomId}/table`]={}; await update(ref(db),updates); alert('카드 분배 완료 — 게임 시작');
};

// ===== 룸/플레이어/테이블 렌더 =====
function listenRoom(roomId){const roomRef=ref(db,`rooms/${roomId}`); onValue(roomRef,snap=>{if(!snap.exists()){alert('방 삭제됨'); return;} const room=snap.val();
  roomIdDisplay.textContent=roomId; turnDisplay.textContent=room.turnIndex!==undefined?room.turnIndex:'-';
  get(ref(db,`rooms/${roomId}/players`)).then(snapPlayers=>{const playersObj=snapPlayers.exists()?snapPlayers.val():{}; renderPlayers(playersObj,room);});
  renderTable(room.table||{});});}

function renderPlayers(playersObj,room){playersList.innerHTML=''; const ids=Object.keys(playersObj||{}); ids.forEach(pid=>{const p=playersObj[pid]; const div=document.createElement('div'); div.className='flex items-center gap-2 p-2 bg-slate-50 rounded'; const ava=document.createElement('div'); ava.className='avatar'; ava.textContent=p.avatar||'🙂'; const txt=document.createElement('div'); txt.innerHTML=`<div class="text-sm font-semibold">${p.name}</div><div class="text-xs text-gray-500">${(p.hand||[]).length}장</div>`; if(pid===localPlayerId) txt.innerHTML+='<div class="text-xs text-amber-500"> (You)</div>'; div.appendChild(ava); div.appendChild(txt); playersList.appendChild(div);});}

function renderTable(tbl){tableArea.innerHTML=''; const entries=Object.entries(tbl||{}); if(entries.length===0){tableArea.innerHTML='<div class="text-sm text-gray-500">아직 제출된 카드 없음.</div>'; return;} entries.forEach(([pid,cards])=>{const node=document.createElement('div'); node.className='mb-2'; node.innerHTML=`<div class="text-xs text-gray-500">${pid}</div><div class="flex gap-2 mt-1">${cards.map(c=>`<div class="card bg-slate-50">${c===0?'광대':c}</div>`).join('')}</div>`; tableArea.appendChild(node);});}

// ===== 카드 선택 =====
function renderMyHand(hand){myHandDiv.innerHTML=''; hand.sort((a,b)=>a-b).forEach((card,idx)=>{const d=document.createElement('div'); d.className='card bg-white'; d.innerText=card===0?'광대':card; d.onclick=()=>{if(mySelectedIndices.includes(idx)){mySelectedIndices=mySelectedIndices.filter(i=>i!==idx);d.classList.remove('selected');}else{mySelectedIndices.push(idx);d.classList.add('selected');}}; myHandDiv.appendChild(d);});}

// ===== 패스/제출 =====
passBtn.onclick=async()=>{if(!currentRoomId||!localPlayerId)return; await push(ref(db,`rooms/${currentRoomId}/actions`),{type:'pass',playerId:localPlayerId,ts:Date.now()}); mySelectedIndices=[];}
submitBtn.onclick=async()=>{if(!currentRoomId||!localPlayerId)return; if(mySelectedIndices.length===0)return alert('카드 선택'); await push(ref(db,`rooms/${currentRoomId}/actions`),{type:'play',playerId:localPlayerId,selectedIndices:mySelectedIndices,ts:Date.now()}); mySelectedIndices=[];}

// ===== 호스트 액션 큐 처리 (턴/클라이밍 규칙 포함) =====
function attachRoomMetaWatcher(roomId){
  if(!isHost) return;
  const actionsRef=ref(db,`rooms/${roomId}/actions`);
  onValue(actionsRef,async snap=>{
    if(!snap.exists()) return;
    const actions=snap.val(); const keys=Object.keys(actions).sort();
    const roomSnap=await get(ref(db,`rooms/${roomId}`));
    if(!roomSnap.exists()) return;
    const room=roomSnap.val();
    const playersSnap=await get(ref(db,`rooms/${roomId}/players`));
    const playersObj=playersSnap.exists()?playersSnap.val():{};
    const order=Object.keys(playersObj||{}); if(order.length===0) return;
    for(const k of keys){
      const a=actions[k]; const expectedPid=order[room.turnIndex%order.length];
      if(a.playerId!==expectedPid){await remove(child(actionsRef,k)); continue;}
      if(a.type==='pass'){room.turnIndex=(room.turnIndex+1)%order.length; await update(ref(db,`rooms/${roomId}`),{turnIndex:room.turnIndex});}
      else if(a.type==='play'){const hand=playersObj[a.playerId].hand; const played=a.selectedIndices.map(i=>hand[i]); played.forEach(c=>{const idx=hand.indexOf(c); if(idx>=0) hand.splice(idx,1);}); room.table[a.playerId]=played; room.turnIndex=(room.turnIndex+1)%order.length; await update(ref(db,`rooms/${roomId}`),{turnIndex:room.turnIndex,table:room.table});}
      await remove(child(actionsRef,k));
    }
  });
}
</script>

</body>
</html>
