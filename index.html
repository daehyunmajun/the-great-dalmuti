// ===== 카드덱 생성 (12..1 각 숫자 장수 + 광대 2장) =====
function makeDeck(){
  const counts = {12:12,11:11,10:10,9:9,8:8,7:7,6:6,5:5,4:4,3:3,2:2,1:1};
  const deck = [];
  for(const [n,c] of Object.entries(counts)){
    for(let i=0;i<c;i++) deck.push(Number(n));
  }
  deck.push(0,0); // 광대
  return deck;
}

// ===== 방 생성 =====
createBtn.onclick = async () => {
  localName = (nameInput.value || 'Host').slice(0,16);
  localAvatar = (avatarInput.value || '👑').slice(0,64);
  localPlayerId = 'P' + Math.floor(Math.random()*1000000);
  isHost = true;

  // 방 ID: 간단 랜덤 6글자
  const roomId = Math.random().toString(36).slice(2,8).toUpperCase();
  currentRoomId = roomId;
  roomIdDisplay.textContent = roomId;

  // 초기 방 구조
  const roomRef = ref(db, `rooms/${roomId}`);
  await set(roomRef, {
    host: localPlayerId,
    turnIndex: 0,
    roundNumber: null,
    roundCount: null,
    table: {},
    createdAt: Date.now()
  });

  // 참가자 등록
  const playersRef = ref(db, `rooms/${roomId}/players/${localPlayerId}`);
  await set(playersRef, { name: localName, avatar: localAvatar, hand: [] });

  hostDisplay.textContent = localName + " (You)";
  listenRoom(roomId);
  showMessage(`방 생성됨: ${roomId} (호스트)`);
};

// ===== 방 참가 =====
joinBtn.onclick = async () => {
  const roomId = (roomInput.value || '').trim().toUpperCase();
  if(!roomId){ alert('방 ID를 입력하세요'); return; }
  localName = (nameInput.value || 'Player').slice(0,16);
  localAvatar = (avatarInput.value || '🙂').slice(0,64);
  localPlayerId = 'P' + Math.floor(Math.random()*1000000);
  isHost = false;
  currentRoomId = roomId;

  // 존재 여부 확인
  const snapshot = await get(ref(db, `rooms/${roomId}`));
  if(!snapshot.exists()){ alert('해당 방이 없습니다'); return; }

  // 참가자 등록
  const playersRef = ref(db, `rooms/${roomId}/players/${localPlayerId}`);
  await set(playersRef, { name: localName, avatar: localAvatar, hand: [] });

  roomIdDisplay.textContent = roomId;
  hostDisplay.textContent = '(joining...)';
  listenRoom(roomId);
  showMessage(`방 가입 요청 전송: ${roomId}`);
};

// ===== 호스트가 게임 시작 (카드 분배) =====
startGameBtn.onclick = async () => {
  if(!currentRoomId) return alert('방에 먼저 입장하세요');
  const r = await get(ref(db, `rooms/${currentRoomId}`));
  if(!r.exists()) return alert('방 정보 없음');
  const room = r.val();
  if(room.host !== localPlayerId) return alert('호스트만 게임 시작 가능');

  const playersSnap = await get(ref(db, `rooms/${currentRoomId}/players`));
  const players = playersSnap.exists() ? Object.keys(playersSnap.val()) : [];
  if(players.length === 0) return alert('참가자가 없습니다');

  // 카드 분배 — 한 장씩 순환 분배 (낭비 카드 없음)
  const deck = makeDeck().sort(()=>Math.random()-0.5);
  const hands = {};
  players.forEach(pid => hands[pid] = []);
  let idx = 0;
  deck.forEach(card => {
    const pid = players[idx];
    hands[pid].push(card);
    idx = (idx + 1) % players.length;
  });

  // DB 업데이트: 각 플레이어의 hand 넣기
  const updates = {};
  for(const pid of players){
    updates[`rooms/${currentRoomId}/players/${pid}/hand`] = hands[pid];
  }
  updates[`rooms/${currentRoomId}/turnIndex`] = 0;
  updates[`rooms/${currentRoomId}/roundNumber`] = null;
  updates[`rooms/${currentRoomId}/roundCount`] = null;
  updates[`rooms/${currentRoomId}/table`] = {};
  await update(ref(db), updates);

  showMessage('카드 분배 완료 — 게임 시작');
};

// ===== 룸 리스너 (모든 참가자가 구독) =====
function listenRoom(roomId){
  const roomRef = ref(db, `rooms/${roomId}`);
  onValue(roomRef, (snap) => {
    if(!snap.exists()) { showMessage('방이 삭제되었거나 존재하지 않습니다', false); return; }
    const room = snap.val();

    // 표시
    roomIdDisplay.textContent = roomId;
    turnDisplay.textContent = room.turnIndex !== undefined ? room.turnIndex : '-';
    // host
    if(room.host){
      get(ref(db, `rooms/${roomId}/players/${room.host}`)).then(s => {
        hostDisplay.textContent = s.exists() ? (s.val().name + (room.host === localPlayerId ? ' (You)' : '')) : '호스트';
      });
    }

    // players 표시 (원본 snapshot)
    get(ref(db, `rooms/${roomId}/players`)).then(snapPlayers => {
      const playersObj = snapPlayers.exists() ? snapPlayers.val() : {};
      renderPlayers(playersObj, room);
    });

    // table
    const table = room.table || {};
    renderTable(table);
  });
}

// ===== 렌더 플레이어 UI (아바타 포함) =====
function renderPlayers(playersObj, room){
  playersList.innerHTML = '';
  // build order array from room.turnIndex rotation
  const ids = Object.keys(playersObj || {});
  // display avatars and small info
  ids.forEach(pid => {
    const p = playersObj[pid];
    const div = document.createElement('div');
    div.className = 'flex items-center gap-2 p-2 bg-slate-50 rounded';
    const ava = document.createElement('div');
    ava.className = 'avatar';
    ava.textContent = p.avatar || '🙂';
    const txt = document.createElement('div');
    txt.innerHTML = `<div class="text-sm font-semibold">${p.name}</div><div class="text-xs text-gray-500">${(p.hand||[]).length}장</div>`;
    if(pid === localPlayerId) txt.innerHTML += '<div class="text-xs text-amber-500"> (You)</div>';
    div.appendChild(ava); div.appendChild(txt);
    playersList.appendChild(div);
  });

  // map players to seat areas (best-effort: up to 4 players)
  const seatIds = Object.keys(playersObj || {});
  document.getElementById('p1Area').innerHTML = seatIds[0] ? seatHtml(seatIds[0], playersObj[seatIds[0]], room.host) : '';
  document.getElementById('p2Area').innerHTML = seatIds[1] ? seatHtml(seatIds[1], playersObj[seatIds[1]], room.host) : '';
  document.getElementById('p3Area').innerHTML = seatIds[2] ? seatHtml(seatIds[2], playersObj[seatIds[2]], room.host) : '';
  document.getElementById('p4Area').innerHTML = seatIds[3] ? seatHtml(seatIds[3], playersObj[seatIds[3]], room.host) : '';

  // render my hand (only client shows my actual cards)
  const myHand = (playersObj[localPlayerId] && playersObj[localPlayerId].hand) ? playersObj[localPlayerId].hand.slice() : [];
  renderMyHand(myHand, room);
  // turn display as name
  if(room && room.turnIndex !== undefined){
    const idsOrder = Object.keys(playersObj || {});
    const ti = room.turnIndex % idsOrder.length;
    const currentPid = idsOrder[ti];
    turnDisplay.textContent = playersObj[currentPid] ? playersObj[currentPid].name : '-';
  }
}

function seatHtml(pid, p, hostId){
  return `<div class="text-sm"><div class="avatar inline-block mr-2">${p.avatar||'🙂'}</div><div class="font-semibold">${p.name}${pid===hostId? ' (H)':''}</div><div class="text-xs text-gray-500">${(p.hand||[]).length}장</div></div>`;
}

// ===== 내 카드 렌더 & 선택 로직 =====
let mySelectedIndices = [];
function renderMyHand(hand, room){
  myHandDiv.innerHTML = '';
  hand.sort((a,b)=>a-b).forEach((card, idx) => {
    const d = document.createElement('div');
    d.className = 'card bg-white';
    d.innerText = card === 0 ? '광대' : card;
    // disabled if not my turn
    if(!room || room.turnIndex === undefined) d.classList.add('disabled');
    // check if it's my turn by mapping order
    const playersObj = room ? (room.players || {}) : {};
    // find index in order
    // We'll assume players order is the DB players list order
    // Enable click always but submission will be validated by host.
    d.onclick = () => {
      // toggle selection by index position in current hand snapshot
      if(mySelectedIndices.includes(idx)){
        mySelectedIndices = mySelectedIndices.filter(i=>i!==idx);
        d.classList.remove('selected');
      } else {
        mySelectedIndices.push(idx);
        d.classList.add('selected');
      }
    };
    myHandDiv.appendChild(d);
  });
}

// ===== 테이블 렌더 (누가 무엇을 냈는지 간단히) =====
function renderTable(tbl){
  tableArea.innerHTML = '';
  const entries = Object.entries(tbl || {});
  if(entries.length === 0){ tableArea.innerHTML = '<div class="text-sm text-gray-500">아직 제출된 카드가 없습니다.</div>'; return; }
  entries.forEach(([pid, cards]) => {
    const node = document.createElement('div');
    node.className = 'mb-2';
    node.innerHTML = `<div class="text-xs text-gray-500">${pid}</div><div class="flex gap-2 mt-1">${cards.map(c=>`<div class="card bg-slate-50">${c===0?'광대':c}</div>`).join('')}</div>`;
    tableArea.appendChild(node);
  });
}

/* ===== 액션: 패스 / 제출 (클라이언트는 요청만 함) ===== */
passBtn.onclick = async () => {
  if(!currentRoomId || !localPlayerId) return alert('방 참가 후 이용하세요');
  // push action request
  await push(ref(db, `rooms/${currentRoomId}/actions`), {
    type: 'pass',
    playerId: localPlayerId,
    ts: Date.now()
  });
  mySelectedIndices = [];
};

submitBtn.onclick = async () => {
  if(!currentRoomId || !localPlayerId) return alert('방 참가 후 이용하세요');
  if(mySelectedIndices.length === 0) return alert('제출할 카드를 선택하세요');
  // push action request to actions queue
  await push(ref(db, `rooms/${currentRoomId}/actions`), {
    type: 'play',
    playerId: localPlayerId,
    selectedIndices: mySelectedIndices,
    ts: Date.now()
  });
  mySelectedIndices = [];
};

/* ======= HOST: 액션 큐 감시 및 처리 =====
   호스트 클라이언트만 actions 노드의 child 추가를 감시하여 처리함.
*/
function startHostActionListener(roomId){
  const actionsRef = ref(db, `rooms/${roomId}/actions`);
  onValue(actionsRef, async (snap) => {
    if(!isHost) return; // 오직 호스트만 처리
    if(!snap.exists()) return;
    const actions = snap.val(); // object
    // process each action in insertion order (push key sorted)
    const keys = Object.keys(actions).sort();
    for(const k of keys){
      const a = actions[k];
      // only process if not already processed (we will remove after processing)
      // re-read room & players for safe state
      const roomSnap = await get(ref(db, `rooms/${roomId}`));
      if(!roomSnap.exists()) continue;
      const room = roomSnap.val();
      const playersSnap = await get(ref(db, `rooms/${roomId}/players`));
      const playersObj = playersSnap.exists() ? playersSnap.val() : {};
      // validate turn
      const order = Object.keys(playersObj || {});
      if(order.length === 0) { await remove(child(actionsRef, k)); continue; }
      const expectedPid = order[room.turnIndex % order.length];
      if(a.playerId !== expectedPid){
        // ignore or notify - remove action to avoid infinite loop
        console.warn('Action from not-current-turn player', a.playerId, 'expected', expectedPid);
        await remove(child(actionsRef, k));
        continue;
      }

      if(a.type === 'pass'){
        // advance turn
        const newIndex = ((room.turnIndex || 0) + 1) % order.length;
        await update(ref(db, `rooms/${roomId}`), { turnIndex: newIndex });
        // remove action
        await remove(child(actionsRef, k));
      } else if(a.type === 'play'){
        // process play: remove selectedIndices from player's hand (careful with indices)
        const pid = a.playerId;
        const playerHandSnap = await get(ref(db, `rooms/${roomId}/players/${pid}/hand`));
        const hand = playerHandSnap.exists() ? playerHandSnap.val() : [];
        // validate indices are within bounds
        const sel = (a.selectedIndices || []).slice().sort((x,y)=>y-x); // descending
        if(!sel.every(i => Number.isInteger(i) && i >=0 && i < hand.length)){
          console.warn('Invalid indices, cancel', sel);
          await remove(child(actionsRef, k));
          continue;
        }
        // collect cards
        const playedCards = sel.map(i => hand[i]);
        // validation: same-number (ignoring 0 wildcards)
        const nonWild = playedCards.filter(c=>c!==0);
        let number = nonWild.length ? nonWild[0] : 0;
        if(nonWild.length > 0 && !nonWild.every(c=>c===number)){
          console.warn('Invalid set (not same number)', playedCards);
          await remove(child(actionsRef, k));
          continue;
        }
        // if room.roundCount exists, must match count and number lower than roundNumber
        const roundCount = room.roundCount;
        const roundNumber = room.roundNumber;
        if(roundCount !== null && roundCount !== undefined){
          if(playedCards.length !== roundCount){
            console.warn('Wrong count');
            await remove(child(actionsRef, k));
            continue;
          }
          if(number >= (roundNumber||0) && number !== 0){
            console.warn('Not lower number');
            await remove(child(actionsRef, k));
            continue;
          }
        }
        // all ok: remove cards from hand
        const newHand = hand.slice();
        sel.forEach(i=>{
          newHand.splice(i,1);
        });
        // write new hand and update table and round info
        const updates = {};
        updates[`rooms/${roomId}/players/${pid}/hand`] = newHand;
        updates[`rooms/${roomId}/table/${pid}`] = playedCards;
        updates[`rooms/${roomId}/roundCount`] = playedCards.length;
        updates[`rooms/${roomId}/roundNumber`] = number;
        // advance turn
        const newIndex = ((room.turnIndex || 0) + 1) % order.length;
        updates[`rooms/${roomId}/turnIndex`] = newIndex;
        await update(ref(db), updates);
        // remove action
        await remove(child(actionsRef, k));
      } else {
        await remove(child(actionsRef, k));
      }
    }
  });
}

/* We'll set a room-specific watcher to detect if we're host and start listener */
function attachRoomMetaWatcher(roomId){
  const metaRef = ref(db, `rooms/${roomId}/host`);
  onValue(metaRef, snap => {
    const h = snap.val();
    if(h === localPlayerId){
      isHost = true;
      startHostActionListener(roomId);
    } else {
      isHost = false;
    }
  });
}

// patch create/join to call attachRoomMetaWatcher
// (re-bind with safer functions)
createBtn.addEventListener('click', () => {
  // current implementation already creates room and calls listenRoom; wait a tick then attach
  setTimeout(()=> { if(currentRoomId) attachRoomMetaWatcher(currentRoomId); }, 800);
});
joinBtn.addEventListener('click', () => {
  setTimeout(()=> { if(currentRoomId) attachRoomMetaWatcher(currentRoomId); }, 800);
});
</script>
