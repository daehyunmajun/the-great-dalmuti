<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>달무티 2~6인 MVP</title>

<!-- Tailwind CSS (개발용) -->
<script src="https://cdn.tailwindcss.com"></script>
<style>
body { background:#f8fafc; font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;}
.card { width:72px;height:104px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;cursor:pointer;user-select:none;box-shadow:0 2px 6px rgba(0,0,0,0.08);}
.card.selected{outline:4px solid #f97316;transform:translateY(-6px);}
.card.disabled{opacity:0.4;cursor:not-allowed;}
.avatar { width:36px;height:36px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;background:#eef2ff;}
</style>
</head>
<body class="p-4 md:p-8">
<div class="max-w-5xl mx-auto">
  <header class="mb-6">
    <h1 class="text-2xl font-extrabold text-sky-700">달무티 MVP 2~6인</h1>
    <p class="text-sm text-gray-600">Firebase + PeerJS 공식 서버 + 미니멀 카드 UI</p>
  </header>

  <section class="mb-4 grid gap-3 md:grid-cols-3">
    <input id="nameInput" placeholder="닉네임" class="p-2 border rounded" />
    <input id="avatarInput" placeholder="아바타(이모지)" class="p-2 border rounded" />
    <div class="flex gap-2">
      <button id="createBtn" class="px-3 py-2 bg-green-600 text-white rounded">방 생성 (호스트)</button>
      <input id="roomInput" placeholder="방 ID 입력" class="p-2 border rounded" />
      <button id="joinBtn" class="px-3 py-2 bg-blue-600 text-white rounded">참가</button>
    </div>
  </section>

  <section class="mb-6 grid md:grid-cols-3 gap-4">
    <div class="col-span-1 bg-white p-4 rounded shadow">
      <h3 class="font-semibold mb-2">방 정보</h3>
      <p>방 ID: <span id="roomIdDisplay" class="font-mono"></span></p>
      <p class="mt-2">호스트: <span id="hostDisplay">-</span></p>
      <p class="mt-2">현재 턴: <span id="turnDisplay">-</span></p>
      <div class="mt-3">
        <button id="startGameBtn" class="px-3 py-2 bg-orange-500 text-white rounded">게임 시작 (호스트)</button>
      </div>
    </div>

    <div class="col-span-2 bg-white p-4 rounded shadow">
      <h3 class="font-semibold mb-2">플레이어 목록</h3>
      <div id="playersList" class="flex gap-3 flex-wrap"></div>
    </div>
  </section>

  <section class="mb-6 bg-white p-4 rounded shadow">
    <div class="grid grid-cols-12 gap-4 items-center">
      <div id="playerAreas" class="col-span-12 grid grid-cols-6 gap-2 text-center"></div>
      <div class="col-span-12 mt-4">
        <div class="mb-3 flex justify-between items-center">
          <div><strong>테이블</strong></div>
          <div>
            <button id="passBtn" class="px-3 py-2 bg-gray-200 rounded">패스</button>
            <button id="submitBtn" class="px-3 py-2 bg-amber-500 text-white rounded ml-2">제출</button>
          </div>
        </div>
        <div id="tableArea" class="mb-3"></div>
        <div>
          <div class="text-sm text-gray-500 mb-2">내 카드 (클릭해 선택 → 제출)</div>
          <div id="myHand" class="flex gap-2 flex-wrap"></div>
        </div>
      </div>
    </div>
  </section>
</div>

<!-- Firebase + PeerJS -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
import { getDatabase, ref, set, update, get, onValue, push, child, remove } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyB6ktKQxiTzvbCHgaB2gd75_DmXHF5bApw",
  authDomain: "the-great-dalmuti.firebaseapp.com",
  databaseURL: "https://the-great-dalmuti-default-rtdb.firebaseio.com",
  projectId: "the-great-dalmuti",
  storageBucket: "the-great-dalmuti.firebasestorage.app",
  messagingSenderId: "421041977864",
  appId: "1:421041977864:web:b04725eab3c4cb436c2fbd",
  measurementId: "G-MJCMWKCH8C"
};

const app = initializeApp(firebaseConfig);

document.addEventListener('DOMContentLoaded', () => {
  const db = getDatabase(app);

  const nameInput = document.getElementById('nameInput');
  const avatarInput = document.getElementById('avatarInput');
  const createBtn = document.getElementById('createBtn');
  const joinBtn = document.getElementById('joinBtn');
  const roomInput = document.getElementById('roomInput');
  const roomIdDisplay = document.getElementById('roomIdDisplay');
  const hostDisplay = document.getElementById('hostDisplay');
  const playersList = document.getElementById('playersList');
  const startGameBtn = document.getElementById('startGameBtn');
  const turnDisplay = document.getElementById('turnDisplay');
  const myHandDiv = document.getElementById('myHand');
  const tableArea = document.getElementById('tableArea');
  const passBtn = document.getElementById('passBtn');
  const submitBtn = document.getElementById('submitBtn');
  const playerAreas = document.getElementById('playerAreas');

  let localPlayerId=null, localName=null, localAvatar=null, currentRoomId=null, isHost=false;
  let mySelectedIndices=[];

  const PEERJS_CONFIG={ host:'peerjs.com', port:443, secure:true };
  let peer, conn;

  function makeDeck(){
    const counts={12:12,11:11,10:10,9:9,8:8,7:7,6:6,5:5,4:4,3:3,2:2,1:1};
    const deck=[];
    for(const [n,c] of Object.entries(counts)) for(let i=0;i<c;i++) deck.push(Number(n));
    deck.push(0,0);
    return deck;
  }

  createBtn.onclick = async ()=>{
    localName=(nameInput.value||'Host').slice(0,16);
    localAvatar=(avatarInput.value||'👑').slice(0,64);
    localPlayerId='P'+Math.floor(Math.random()*1e6);
    isHost=true;
    const roomId=Math.random().toString(36).slice(2,8).toUpperCase();
    currentRoomId=roomId;
    roomIdDisplay.textContent=roomId;

    const roomRef=ref(db, `rooms/${roomId}`);
    await set(roomRef,{host:localPlayerId, turnIndex:0, roundNumber:null, roundCount:null, table:{}, createdAt:Date.now()});
    const playersRef=ref(db, `rooms/${roomId}/players/${localPlayerId}`);
    await set(playersRef,{name:localName, avatar:localAvatar, hand:[]});
    hostDisplay.textContent=localName+' (You)';
    listenRoom(roomId);
    attachRoomMetaWatcher(roomId);
    setupPeer(localPlayerId);
    showMessage(`방 생성됨: ${roomId} (호스트)`);
  };

  joinBtn.onclick = async ()=>{
    const roomId=(roomInput.value||'').trim().toUpperCase();
    if(!roomId){ alert('방 ID 입력'); return; }
    localName=(nameInput.value||'Player').slice(0,16);
    localAvatar=(avatarInput.value||'🙂').slice(0,64);
    localPlayerId='P'+Math.floor(Math.random()*1e6);
    isHost=false;
    currentRoomId=roomId;

    const snapshot=await get(ref(db, `rooms/${roomId}`));
    if(!snapshot.exists()){ alert('해당 방 없음'); return; }

    const playersRef=ref(db, `rooms/${roomId}/players/${localPlayerId}`);
    await set(playersRef,{name:localName, avatar:localAvatar, hand:[]});

    roomIdDisplay.textContent=roomId;
    hostDisplay.textContent='(joining...)';
    listenRoom(roomId);
    attachRoomMetaWatcher(roomId);
    setupPeer(localPlayerId);
    showMessage(`방 참가: ${roomId}`);
  };

  function setupPeer(id){
    peer = new Peer(id, PEERJS_CONFIG);
    peer.on('open', ()=>console.log('Peer open:', id));
    peer.on('connection', c=>{
      conn=c;
      conn.on('data', data=>console.log('받음:',data));
      conn.on('open', ()=>console.log('연결됨'));
    });
    peer.on('error', err=>console.error(err));
  }

  // 나머지 startGameBtn, listenRoom, renderPlayers, renderMyHand, renderTable, passBtn, submitBtn, startHostActionListener, attachRoomMetaWatcher, showMessage 함수 그대로 복사

});
</script>
</body>
</html>
